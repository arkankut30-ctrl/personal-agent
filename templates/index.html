<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الوكيل الشخصي — احترافي</title>
<style>
  :root {
    --bg: #10151c;
    --bg-panel: #161d27;
    --bg-sidebar: #0d1218;
    --bg-bubble-user: #1f2937;
    --accent: #4fd1c5;
    --accent-dim: #2c7a72;
    --text: #e6edf3;
    --text-dim: #8b98a5;
    --border: #232b36;
    --danger: #e5534b;
    --hover: #1c2531;
  }
  [data-theme="light"] {
    --bg: #f7f8fa;
    --bg-panel: #ffffff;
    --bg-sidebar: #eef0f3;
    --bg-bubble-user: #e7ecf0;
    --accent: #0f8f82;
    --accent-dim: #a7ddd6;
    --text: #17212b;
    --text-dim: #64707c;
    --border: #dde2e8;
    --danger: #c9392f;
    --hover: #e5e9ee;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif;
  }
  .layout { display: flex; height: 100vh; }

  /* -------- الشريط الجانبي -------- */
  .sidebar {
    width: 260px; background: var(--bg-sidebar); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .sidebar-header { padding: 16px; }
  .new-chat-btn {
    width: 100%; background: var(--accent); color: #06231f; border: none;
    padding: 11px; border-radius: 10px; font-weight: 600; font-size: 13.5px; cursor: pointer;
  }
  [data-theme="light"] .new-chat-btn { color: #fff; }
  .sessions-list { flex: 1; overflow-y: auto; padding: 4px 10px; }
  .session-item {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 10px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 3px;
    font-size: 13px; color: var(--text-dim);
  }
  .session-item:hover { background: var(--hover); }
  .session-item.active { background: var(--hover); color: var(--text); }
  .session-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .session-del {
    opacity: 0; background: none; border: none; color: var(--danger); cursor: pointer; font-size: 13px;
  }
  .session-item:hover .session-del { opacity: 1; }
  .sidebar-footer {
    padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px;
  }
  .icon-btn {
    flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    padding: 9px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--text-dim); }

  /* -------- المنطقة الرئيسية -------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 16px 22px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); font-family: monospace; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(79,209,197,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(79,209,197,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,209,197,0); }
  }
  .model-tag {
    font-size: 11px; color: var(--text-dim); font-family: monospace;
    border: 1px solid var(--border); padding: 3px 8px; border-radius: 20px;
  }

  #messages { flex: 1; overflow-y: auto; padding: 24px 22px; display: flex; flex-direction: column; gap: 16px; }
  .empty-state { margin: auto; text-align: center; color: var(--text-dim); }
  .empty-state .glyph { font-size: 32px; margin-bottom: 10px; }
  .msg { display: flex; gap: 10px; max-width: 90%; }
  .msg.user { align-self: flex-start; flex-direction: row-reverse; }
  .msg.agent { align-self: flex-start; }
  .bubble { padding: 12px 16px; border-radius: 14px; line-height: 1.7; font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .bubble { background: var(--bg-bubble-user); border: 1px solid var(--border); }
  .msg.agent .bubble { background: transparent; border: 1px solid var(--accent-dim); }
  .tool-note {
    font-family: monospace; font-size: 12px; color: var(--accent); background: rgba(79,209,197,0.08);
    border: 1px solid var(--accent-dim); padding: 8px 12px; border-radius: 8px; align-self: flex-start; max-width: 90%;
  }
  .typing { align-self: flex-start; color: var(--text-dim); font-size: 13px; font-family: monospace; }

  form#chat-form { display: flex; gap: 10px; padding: 16px 22px 22px; border-top: 1px solid var(--border); }
  #input {
    flex: 1; background: var(--bg-panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 13px 16px; font-size: 14.5px; resize: none; font-family: inherit;
  }
  #input:focus { outline: none; border-color: var(--accent-dim); }
  button.send {
    background: var(--accent); color: #06231f; border: none; border-radius: 12px;
    padding: 0 20px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  [data-theme="light"] button.send { color: #fff; }
  button.send:disabled { opacity: 0.5; cursor: not-allowed; }

  /* -------- نوافذ منبثقة -------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none;
    align-items: center; justify-content: center; z-index: 10;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px; max-width: 480px; width: 90%; max-height: 85vh; overflow-y: auto;
  }
  .modal.danger-border { border-color: var(--danger); }
  .modal h3 { margin: 0 0 14px; font-size: 15px; }
  .modal h3.warn { color: var(--danger); }
  .modal code {
    display: block; background: rgba(229,83,75,0.1); padding: 12px; border-radius: 8px;
    margin: 10px 0 16px; font-family: monospace; font-size: 13px; direction: ltr; text-align: left; overflow-x: auto;
  }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
  .modal-actions button { padding: 9px 18px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer; font-weight: 600; }
  .btn-deny { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-approve { background: var(--danger); color: white; }
  .btn-primary { background: var(--accent); color: #06231f; }
  [data-theme="light"] .btn-primary { color: #fff; }

  .setting-row { margin-bottom: 18px; }
  .setting-row label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  select, .toggle-row {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-size: 13.5px;
  }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0; background: var(--border); border-radius: 24px; transition: .2s;
  }
  .slider::before {
    content: ""; position: absolute; width: 18px; height: 18px; right: 3px; bottom: 3px;
    background: white; border-radius: 50%; transition: .2s;
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(-18px); }

  .facts-list { max-height: 160px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
  .fact-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--border);
  }
  .fact-row:last-child { border-bottom: none; }
  .fact-del { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 13px; }
  .no-facts { padding: 14px; color: var(--text-dim); font-size: 13px; text-align: center; }

  .update-box {
    border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 13px; color: var(--text-dim);
  }
  .version-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-family: monospace; font-size: 12px; }

  #messages::-webkit-scrollbar, .sessions-list::-webkit-scrollbar, .facts-list::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb, .sessions-list::-webkit-scrollbar-thumb, .facts-list::-webkit-scrollbar-thumb {
    background: var(--border); border-radius: 3px;
  }
</style>
</head>
<body data-theme="dark">
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" id="new-chat-btn">+ محادثة جديدة</button>
    </div>
    <div class="sessions-list" id="sessions-list"></div>
    <div class="sidebar-footer">
      <button class="icon-btn" id="settings-btn">⚙️ الإعدادات</button>
    </div>
  </aside>

  <div class="main">
    <header>
      <div class="brand">
        <h1>الوكيل الشخصي</h1>
        <span class="status"><span class="dot"></span>يعمل محليًا</span>
      </div>
      <span class="model-tag" id="model-tag">—</span>
    </header>

    <div id="messages">
      <div class="empty-state" id="empty-state">
        <div class="glyph">◐</div>
        <div>اكتب رسالتك بالأسفل للبدء</div>
      </div>
    </div>

    <form id="chat-form">
      <textarea id="input" rows="1" placeholder="اكتب رسالتك..." autofocus></textarea>
      <button type="submit" class="send" id="send-btn">إرسال</button>
    </form>
  </div>
</div>

<!-- نافذة تأكيد أمر shell -->
<div class="modal-backdrop" id="confirm-backdrop">
  <div class="modal danger-border">
    <h3 class="warn">⚠️ الوكيل يريد تنفيذ أمر على جهازك</h3>
    <code id="confirm-command"></code>
    <div class="modal-actions">
      <button class="btn-deny" id="deny-btn">رفض</button>
      <button class="btn-approve" id="approve-btn">موافقة وتنفيذ</button>
    </div>
  </div>
</div>

<!-- نافذة الإعدادات -->
<div class="modal-backdrop" id="settings-backdrop">
  <div class="modal">
    <h3>⚙️ الإعدادات</h3>

    <div class="setting-row">
      <label>النموذج المستخدم</label>
      <select id="model-select"></select>
    </div>

    <div class="setting-row">
      <div class="toggle-row">
        <span>تأكيد قبل تنفيذ أوامر shell</span>
        <label class="switch">
          <input type="checkbox" id="confirm-shell-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="setting-row">
      <div class="toggle-row">
        <span>الثيم الفاتح</span>
        <label class="switch">
          <input type="checkbox" id="theme-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="setting-row">
      <label>المعلومات المحفوظة عنك</label>
      <div class="facts-list" id="facts-list"></div>
    </div>

    <div class="setting-row">
      <label>الأداء والتعلّم</label>
      <div class="update-box">
        <div class="version-row"><span>أنوية معالج مستخدمة</span><span id="cpu-threads">—</span></div>
        <div class="version-row"><span>معلومات متعلّمة من الإنترنت</span><span id="knowledge-count">—</span></div>
      </div>
    </div>

    <div class="setting-row">
      <label>التحديثات</label>
      <div class="update-box">
        <div class="version-row"><span>النسخة الحالية</span><span id="local-version">—</span></div>
        <div id="update-message" style="margin-bottom:10px;">اضغط "تحقق من التحديثات" للفحص.</div>
        <div style="display:flex; gap:8px;">
          <button class="icon-btn" id="check-update-btn" style="flex:1;">تحقق من التحديثات</button>
          <button class="icon-btn" id="apply-update-btn" style="flex:1; display:none;">تطبيق التحديث</button>
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-primary" id="close-settings-btn">تم</button>
    </div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('empty-state');
const form = document.getElementById('chat-form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const confirmBackdrop = document.getElementById('confirm-backdrop');
const confirmCommandEl = document.getElementById('confirm-command');
const approveBtn = document.getElementById('approve-btn');
const denyBtn = document.getElementById('deny-btn');
const newChatBtn = document.getElementById('new-chat-btn');
const sessionsListEl = document.getElementById('sessions-list');
const settingsBtn = document.getElementById('settings-btn');
const settingsBackdrop = document.getElementById('settings-backdrop');
const closeSettingsBtn = document.getElementById('close-settings-btn');
const modelSelect = document.getElementById('model-select');
const confirmShellToggle = document.getElementById('confirm-shell-toggle');
const themeToggle = document.getElementById('theme-toggle');
const factsListEl = document.getElementById('facts-list');
const modelTag = document.getElementById('model-tag');
const checkUpdateBtn = document.getElementById('check-update-btn');
const applyUpdateBtn = document.getElementById('apply-update-btn');
const updateMessageEl = document.getElementById('update-message');
const localVersionEl = document.getElementById('local-version');
const cpuThreadsEl = document.getElementById('cpu-threads');
const knowledgeCountEl = document.getElementById('knowledge-count');

function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function clearMessages() {
  messagesEl.innerHTML = '';
  messagesEl.appendChild(emptyState);
  emptyState.style.display = 'block';
}

function addMessage(role, text) {
  emptyState.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollDown();
}

function addToolNote(text) {
  emptyState.style.display = 'none';
  const note = document.createElement('div');
  note.className = 'tool-note';
  note.textContent = '🔧 ' + text;
  messagesEl.appendChild(note);
  scrollDown();
}

function addTyping() {
  const el = document.createElement('div');
  el.className = 'typing'; el.id = 'typing-indicator'; el.textContent = 'الوكيل يفكر...';
  messagesEl.appendChild(el); scrollDown();
}
function removeTyping() { document.getElementById('typing-indicator')?.remove(); }
function setBusy(busy) { sendBtn.disabled = busy; input.disabled = busy; }

async function handleResult(data) {
  removeTyping();
  if (data.error) { addMessage('agent', '❌ ' + data.error); setBusy(false); return; }
  if (data.needs_confirmation) {
    confirmCommandEl.textContent = data.command;
    confirmBackdrop.classList.add('show');
    return;
  }
  if (data.reply) addMessage('agent', data.reply);
  setBusy(false);
  input.focus();
  loadSessions();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMessage('user', text);
  input.value = ''; input.style.height = 'auto';
  setBusy(true); addTyping();
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: text}) });
    await handleResult(await res.json());
  } catch (err) { removeTyping(); addMessage('agent', '❌ تعذر الاتصال بالخادم المحلي.'); setBusy(false); }
});

input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

async function sendConfirmation(approved) {
  confirmBackdrop.classList.remove('show');
  addToolNote(approved ? ('تم تنفيذ: ' + confirmCommandEl.textContent) : 'تم رفض تنفيذ الأمر');
  addTyping();
  try {
    const res = await fetch('/api/confirm', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({approved}) });
    await handleResult(await res.json());
  } catch (err) { removeTyping(); addMessage('agent', '❌ تعذر الاتصال بالخادم المحلي.'); setBusy(false); }
}
approveBtn.addEventListener('click', () => sendConfirmation(true));
denyBtn.addEventListener('click', () => sendConfirmation(false));

/* ---------- الجلسات ---------- */
async function loadSessions() {
  const res = await fetch('/api/sessions');
  const data = await res.json();
  sessionsListEl.innerHTML = '';
  data.sessions.forEach(s => {
    const item = document.createElement('div');
    item.className = 'session-item' + (s.id === data.active ? ' active' : '');
    item.innerHTML = `<span class="session-title">${s.title}</span><button class="session-del">✕</button>`;
    item.querySelector('.session-title').addEventListener('click', () => openSession(s.id));
    item.querySelector('.session-del').addEventListener('click', async (e) => {
      e.stopPropagation();
      await fetch('/api/sessions/' + s.id, { method: 'DELETE' });
      loadSessions().then(() => openSession(null));
    });
    sessionsListEl.appendChild(item);
  });
}

async function openSession(sid) {
  if (sid) {
    const res = await fetch('/api/sessions/' + sid);
    const data = await res.json();
    clearMessages();
    data.messages.forEach(m => addMessage(m.role === 'user' ? 'user' : 'agent', m.content));
  } else {
    const res = await fetch('/api/sessions');
    const data = await res.json();
    if (data.active) {
      const r2 = await fetch('/api/sessions/' + data.active);
      const d2 = await r2.json();
      clearMessages();
      d2.messages.forEach(m => addMessage(m.role === 'user' ? 'user' : 'agent', m.content));
    }
  }
  loadSessions();
}

newChatBtn.addEventListener('click', async () => {
  await fetch('/api/sessions', { method: 'POST' });
  clearMessages();
  loadSessions();
});

/* ---------- الإعدادات ---------- */
async function openSettings() {
  settingsBackdrop.classList.add('show');

  const [modelsRes, settingsRes, factsRes] = await Promise.all([
    fetch('/api/models'), fetch('/api/settings'), fetch('/api/facts')
  ]);
  const modelsData = await modelsRes.json();
  const settingsData = await settingsRes.json();
  const factsData = await factsRes.json();

  modelSelect.innerHTML = '';
  (modelsData.models.length ? modelsData.models : [settingsData.model]).forEach(m => {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    if (m === settingsData.model) opt.selected = true;
    modelSelect.appendChild(opt);
  });

  confirmShellToggle.checked = settingsData.confirm_shell;
  themeToggle.checked = settingsData.theme === 'light';
  modelTag.textContent = settingsData.model;
  cpuThreadsEl.textContent = settingsData.cpu_threads;
  knowledgeCountEl.textContent = settingsData.knowledge_count;

  factsListEl.innerHTML = '';
  if (!factsData.facts.length) {
    factsListEl.innerHTML = '<div class="no-facts">لا توجد معلومات محفوظة بعد.</div>';
  } else {
    factsData.facts.forEach((f, i) => {
      const row = document.createElement('div');
      row.className = 'fact-row';
      row.innerHTML = `<span>${f}</span><button class="fact-del">✕</button>`;
      row.querySelector('.fact-del').addEventListener('click', async () => {
        await fetch('/api/facts/' + i, { method: 'DELETE' });
        openSettings();
      });
      factsListEl.appendChild(row);
    });
  }

  checkUpdate();
}

settingsBtn.addEventListener('click', openSettings);
closeSettingsBtn.addEventListener('click', () => settingsBackdrop.classList.remove('show'));

modelSelect.addEventListener('change', async () => {
  await fetch('/api/settings', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({model: modelSelect.value}) });
  modelTag.textContent = modelSelect.value;
});
confirmShellToggle.addEventListener('change', async () => {
  await fetch('/api/settings', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({confirm_shell: confirmShellToggle.checked}) });
});
themeToggle.addEventListener('change', async () => {
  const theme = themeToggle.checked ? 'light' : 'dark';
  document.body.setAttribute('data-theme', theme);
  await fetch('/api/settings', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({theme}) });
});

/* ---------- التحديثات ---------- */
async function checkUpdate() {
  updateMessageEl.textContent = 'جاري الفحص...';
  applyUpdateBtn.style.display = 'none';
  try {
    const res = await fetch('/api/check_update');
    const data = await res.json();
    localVersionEl.textContent = data.local_version || '—';
    updateMessageEl.textContent = data.message;
    if (data.available) applyUpdateBtn.style.display = 'block';
  } catch (e) {
    updateMessageEl.textContent = 'تعذر فحص التحديثات.';
  }
}
checkUpdateBtn.addEventListener('click', checkUpdate);
applyUpdateBtn.addEventListener('click', async () => {
  updateMessageEl.textContent = 'جاري تطبيق التحديث...';
  const res = await fetch('/api/apply_update', { method: 'POST' });
  const data = await res.json();
  updateMessageEl.textContent = data.message;
  applyUpdateBtn.style.display = 'none';
});

/* ---------- التهيئة الأولية ---------- */
(async function init() {
  const settingsRes = await fetch('/api/settings');
  const settingsData = await settingsRes.json();
  document.body.setAttribute('data-theme', settingsData.theme);
  modelTag.textContent = settingsData.model;
  await openSession(null);
})();
</script>
</body>
</html>
